name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: unzip -q ./*.zip -d src
      - run: cd src && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NovaScanner-apk
          path: src/app/build/outputs/apk/release/*.apk
